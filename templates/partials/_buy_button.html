{% if request.user.is_authenticated %}
  {% if car.is_sold %}
    <button class="button-danger w-full" disabled>Already sold</button>
  {% else %}
  <form method="post" action="{% url 'trailer:add_to_cart' car.pk %}">
    {% csrf_token %}
    <input type="hidden" name="quantity" value="1">
    <button type="submit" class="button-primary w-full">Reserve this car <span aria-hidden="true">→</span></button>
  </form>
  {% endif %}
{% else %}
  <a class="button-primary w-full"
     href="{% url 'account_login' %}?next={{ request.path }}">
    Sign in to reserve
  </a>
{% endif %}
