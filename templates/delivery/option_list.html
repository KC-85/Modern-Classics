{% extends "base.html" %}{% block title %}Delivery Options — Modern Classics{% endblock %}{% block content %}<header class="border-b border-white/10 bg-carbon py-16"><div class="site-container flex items-end justify-between"><div><p class="eyebrow">Operations</p><h1 class="page-title mt-5">Delivery options</h1></div><a class="button-primary" href="{% url 'delivery:option_add' %}">Add option</a></div></header><section class="site-container py-14"><div class="divide-y divide-white/10 border-y border-white/10">{% for opt in object_list %}<div class="flex items-center justify-between gap-6 py-6"><div><p class="font-display text-2xl">{{ opt.name }}</p><p class="mt-2 text-sm text-cream/40">£{{ opt.price }}</p></div><div class="flex gap-4"><a class="text-xs font-bold text-brass" href="{% url 'delivery:option_edit' opt.pk %}">Edit</a><a class="text-xs font-bold text-red-300" href="{% url 'delivery:option_delete' opt.pk %}">Delete</a></div></div>{% empty %}<p class="py-10 text-cream/45">No delivery options defined.</p>{% endfor %}</div></section>{% endblock %}
