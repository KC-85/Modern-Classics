{% extends "base.html" %}{% block title %}Reset Password — Modern Classics{% endblock %}{% block content %}<section class="site-container py-20"><div class="surface-card mx-auto max-w-xl p-7 md:p-10"><p class="eyebrow">Account recovery</p><h1 class="section-title mt-5">Reset your password</h1><p class="mt-5 text-sm leading-7 text-cream/50">Enter your email and we’ll send you a secure reset link.</p><form method="post" action="{% url 'account_reset_password' %}" class="mt-8">{% csrf_token %}{{ form.as_p }}<button class="button-primary mt-3 w-full" type="submit">Send reset link</button></form><a class="mt-6 block text-center text-xs font-bold uppercase tracking-widest text-cream/40 hover:text-brass" href="{% url 'account_login' %}">Back to sign in</a></div></section>{% endblock %}
