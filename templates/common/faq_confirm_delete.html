{% extends "base.html" %}
{% block title %}Delete Question — Modern Classics{% endblock %}
{% block content %}<section class="site-container py-20"><div class="mx-auto max-w-2xl"><p class="eyebrow !text-red-300">Content management</p><h1 class="page-title mt-5">Delete this question?</h1><div class="surface-card mt-8 p-6"><p class="font-display text-3xl">{{ object.question }}</p><p class="mt-4 text-sm leading-7 text-cream/45">{{ object.answer|truncatechars:200 }}</p></div><form method="post" class="mt-8 flex gap-3">{% csrf_token %}<button class="button-danger" type="submit">Delete question</button><a class="button-secondary" href="{% url 'common:faq_list' %}">Cancel</a></form></div></section>{% endblock %}
